<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Geometric Dash</title>
  <style>
    :root {
      --bg-dark: #0b0f1b;
      --bg-mid: #171b2e;
      --bg-panel: rgba(24, 8, 16, 0.9);
      --panel-border: rgba(255,255,255,0.14);
      --pink-1: #ff6bb7;
      --pink-2: #ff4f95;
      --red-1: #ff5d75;
      --orange-1: #ffb26b;
      --yellow-1: #ffeb8d;
      --purple-1: #6346d8;
      --purple-2: #3e2f9c;
      --blue-1: #8bd8ff;
      --blue-2: #4a8bff;
      --text: #f6f3ff;
      --shadow-dark: rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #game-shell {
      position: relative;
      width: min(100vw, 1100px);
      height: min(100vh, 620px);
      background: linear-gradient(180deg, #181a2d 0%, #0d1320 100%);
      border: 4px solid rgba(255,255,255,0.15);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 22px 60px rgba(0,0,0,0.45);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #0e1a2f 0%, #171c34 34%, #1a0d25 100%);
      touch-action: none;
      user-select: none;
    }

    .hud {
      position: absolute;
      left: 18px;
      right: 18px;
      top: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 12;
      pointer-events: none;
    }

    .hud-card {
      background: rgba(17, 18, 25, 0.68);
      border: 2px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 10px 12px;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.04);
    }

    .level-text {
      color: #8bdcff;
      font-weight: 900;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-size: 12px;
    }

    .status-text {
      color: #edf4ff;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 11px;
    }

    .controls-bar {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 18px;
      z-index: 12;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .touch-buttons {
      display: flex;
      gap: 12px;
      pointer-events: auto;
    }

    .action-btn {
      border: 0;
      border-radius: 12px;
      min-width: 108px;
      min-height: 52px;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      color: white;
      background: linear-gradient(180deg, #ffba45 0%, #ff7b2a 100%);
      box-shadow: 0 8px 0 rgba(122, 54, 9, 0.9), 0 12px 18px rgba(0,0,0,0.24);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .pause-btn {
      background: linear-gradient(180deg, #7b7eff 0%, #485bdc 100%);
      box-shadow: 0 8px 0 rgba(18, 31, 105, 0.9), 0 12px 18px rgba(0,0,0,0.24);
    }

    .action-btn:active {
      transform: translateY(3px);
      box-shadow: 0 4px 0 rgba(122, 54, 9, 0.9), 0 7px 14px rgba(0,0,0,0.2);
    }

    .menu-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      background: linear-gradient(180deg, rgba(17, 7, 12, 0.45), rgba(12, 11, 20, 0.7));
    }

    .menu-card {
      width: min(82%, 640px);
      min-height: 360px;
      padding: 18px 24px 16px;
      border-radius: 18px;
      border: 4px solid rgba(255,255,255,0.12);
      background: linear-gradient(180deg, rgba(47, 0, 18, 0.96), rgba(31, 7, 17, 0.96));
      box-shadow: 0 22px 50px rgba(0,0,0,0.38), inset 0 0 0 2px rgba(255,255,255,0.04);
      position: relative;
      text-align: center;
    }

    .menu-card::before {
      content: "";
      position: absolute;
      inset: 12px;
      border-radius: 14px;
      border: 2px solid rgba(255,255,255,0.08);
      pointer-events: none;
    }

    .menu-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 8px 0 10px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      font-weight: 900;
      color: rgba(255,255,255,0.88);
    }

    .menu-header .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: linear-gradient(180deg, #ffe273 0%, #ffcb42 100%);
      box-shadow: 0 0 12px rgba(255, 198, 60, 0.7);
    }

    .title-wrap {
      position: relative;
      z-index: 1;
      margin-top: 4px;
      margin-bottom: 6px;
    }

    .title-wrap h1 {
      margin: 0;
      font-size: clamp(2.2rem, 5vw, 4.2rem);
      line-height: 0.9;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 900;
      color: #ffedf8;
      text-shadow:
        0 4px 0 #7b0d39,
        0 8px 0 #4c061a,
        0 18px 24px rgba(255, 90, 126, 0.35);
      background: linear-gradient(180deg, #ffd9e9 0%, #ff8db3 18%, #ff6997 36%, #ff7e6f 58%, #ffb061 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .title-wrap .small {
      letter-spacing: 0.19em;
    }

    .subtext {
      margin: 8px 0 20px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: rgba(255,255,255,0.75);
      font-weight: 700;
    }

    .level-picker {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(2, minmax(160px, 1fr));
      gap: 12px;
      max-width: 420px;
      margin: 0 auto 18px;
    }

    .level-btn {
      border: 0;
      border-radius: 12px;
      padding: 14px 12px;
      font-size: 14px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 900;
      color: white;
      cursor: pointer;
      background: linear-gradient(180deg, #5d7afc 0%, #2d5bd7 100%);
      box-shadow: 0 7px 0 rgba(25, 40, 112, 0.9), 0 12px 18px rgba(0,0,0,0.22);
      transition: transform 0.12s ease, filter 0.12s ease;
    }

    .level-btn.active {
      background: linear-gradient(180deg, #ff9a30 0%, #ff6f0d 100%);
      box-shadow: 0 7px 0 rgba(129, 59, 10, 0.9), 0 12px 18px rgba(0,0,0,0.22);
    }

    .level-btn:active {
      transform: translateY(2px);
      box-shadow: 0 4px 0 rgba(129, 59, 10, 0.9), 0 8px 14px rgba(0,0,0,0.18);
    }

    .menu-actions {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-top: 8px;
    }

    .icon-btn {
      width: 54px;
      height: 54px;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
      background: linear-gradient(180deg, #ffb534 0%, #ff7d2a 100%);
      color: white;
      font-size: 24px;
      font-weight: 900;
      box-shadow: 0 6px 0 rgba(118, 55, 12, 0.9), 0 10px 18px rgba(0,0,0,0.2);
    }

    .icon-btn.secondary {
      background: linear-gradient(180deg, #6d81ff 0%, #3e55d2 100%);
      box-shadow: 0 6px 0 rgba(19, 31, 98, 0.9), 0 10px 18px rgba(0,0,0,0.2);
    }

    .start-btn {
      min-width: 170px;
      border: 0;
      border-radius: 14px;
      padding: 16px 18px;
      background: linear-gradient(180deg, #ff6ad1 0%, #d82be1 100%);
      color: white;
      font-size: 15px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      cursor: pointer;
      box-shadow: 0 8px 0 rgba(120, 20, 143, 0.9), 0 16px 26px rgba(189, 48, 236, 0.26);
    }

    .icon-btn:active,
    .start-btn:active {
      transform: translateY(2px);
      box-shadow: 0 4px 0 rgba(120, 20, 143, 0.9), 0 10px 16px rgba(189, 48, 236, 0.2);
    }

    .hidden { display: none !important; }

    @media (max-width: 780px) {
      #game-shell {
        width: 100vw;
        height: 100vh;
        border-radius: 0;
      }

      .menu-card {
        width: min(90%, 540px);
      }

      .level-picker {
        grid-template-columns: 1fr;
      }

      .controls-bar {
        left: 12px;
        right: 12px;
        bottom: 12px;
      }

      .action-btn {
        min-width: 94px;
      }

      .hud {
        left: 12px;
        right: 12px;
        top: 12px;
      }
    }
  </style>
</head>
<body>
  <div id="game-shell">
    <div class="hud">
      <div class="hud-card level-text" id="levelName">Level 1</div>
      <div class="hud-card status-text" id="statusText">Ready</div>
    </div>

    <canvas id="gameCanvas" width="1100" height="620"></canvas>

    <div class="controls-bar">
      <div class="touch-buttons">
        <button class="action-btn jump-btn" id="jumpButton">Jump</button>
        <button class="action-btn pause-btn" id="pauseButton">Pause</button>
      </div>
    </div>

    <div class="menu-overlay" id="menuOverlay">
      <div class="menu-card">
        <div class="menu-header">
          <span class="dot"></span>
          <span>Geometry</span>
          <span class="dot"></span>
        </div>

        <div class="title-wrap">
          <h1><span class="small">Geometric</span><br />Dash</h1>
        </div>

        <div class="subtext">Select a level + start</div>

        <div class="level-picker">
          <button class="level-btn active" data-level="0">Level 1</button>
          <button class="level-btn" data-level="1">Level 2</button>
        </div>

        <div class="menu-actions">
          <button class="icon-btn" aria-label="play">▶</button>
          <button class="start-btn" id="startButton">Play</button>
          <button class="icon-btn secondary" aria-label="options">⚙</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const levelName = document.getElementById('levelName');
    const statusText = document.getElementById('statusText');
    const menuOverlay = document.getElementById('menuOverlay');
    const startButton = document.getElementById('startButton');
    const jumpButton = document.getElementById('jumpButton');
    const pauseButton = document.getElementById('pauseButton');

    const BASE_GRAVITY = 1750;
    const keys = {};

    const levels = [
      {
        name: 'Level 1: Skyline Rush',
        speed: 360,
        groundY: 454,
        endX: 2100,
        playerStartX: 120,
        playerStartY: 454 - 36,
        obstacles: [
          { x: 520, y: 454, w: 46, h: 36 },
          { x: 720, y: 454, w: 34, h: 36 },
          { x: 885, y: 454, w: 54, h: 36 },
          { x: 1115, y: 454, w: 38, h: 36 },
          { x: 1280, y: 454, w: 78, h: 36 },
          { x: 1500, y: 454, w: 42, h: 36 },
          { x: 1680, y: 454, w: 52, h: 36 },
          { x: 1880, y: 454, w: 60, h: 36 }
        ]
      },
      {
        name: 'Level 2: Neon Pulse',
        speed: 410,
        groundY: 454,
        endX: 2400,
        playerStartX: 120,
        playerStartY: 454 - 36,
        obstacles: [
          { x: 470, y: 454, w: 36, h: 36 },
          { x: 640, y: 454, w: 48, h: 36 },
          { x: 820, y: 454, w: 36, h: 36 },
          { x: 960, y: 454, w: 74, h: 36 },
          { x: 1160, y: 454, w: 38, h: 36 },
          { x: 1350, y: 454, w: 58, h: 36 },
          { x: 1560, y: 454, w: 42, h: 36 },
          { x: 1740, y: 454, w: 90, h: 36 },
          { x: 1960, y: 454, w: 38, h: 36 },
          { x: 2160, y: 454, w: 62, h: 36 }
        ]
      }
    ];

    const game = {
      levelIndex: 0,
      running: false,
      paused: false,
      won: false,
      lost: false,
      lastTime: 0,
      cameraX: 0,
      stars: []
    };

    const player = {
      x: 120,
      y: 454 - 36,
      w: 36,
      h: 36,
      vy: 0,
      jumpForce: 690,
      onGround: true,
      color: '#73f5ff'
    };

    function initStars() {
      game.stars = [];
      for (let i = 0; i < 90; i++) {
        game.stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height * 0.65,
          r: Math.random() * 2.1 + 0.8,
          a: Math.random() * 0.7 + 0.2
        });
      }
    }

    function resetPlayer() {
      const level = levels[game.levelIndex];
      player.x = level.playerStartX;
      player.y = level.playerStartY;
      player.vy = 0;
      player.onGround = true;
    }

    function setStatus(msg) {
      statusText.textContent = msg;
    }

    function updateLevelButtons() {
      document.querySelectorAll('.level-btn').forEach((button) => {
        button.classList.toggle('active', Number(button.dataset.level) === game.levelIndex);
      });
    }

    function setCurrentLevel(index) {
      game.levelIndex = index;
      game.running = false;
      game.paused = false;
      game.won = false;
      game.lost = false;
      game.cameraX = 0;
      resetPlayer();
      levelName.textContent = levels[index].name;
      setStatus('Ready');
      updateLevelButtons();
    }

    function startLevel() {
      resetPlayer();
      game.running = true;
      game.paused = false;
      game.won = false;
      game.lost = false;
      menuOverlay.classList.add('hidden');
      setStatus('Running');
    }

    function togglePause() {
      if (!game.running || game.won || game.lost) return;
      game.paused = !game.paused;
      setStatus(game.paused ? 'Paused' : 'Running');
    }

    function jump() {
      if (!game.running || game.paused) return;
      if (player.onGround) {
        player.vy = -player.jumpForce;
        player.onGround = false;
      }
    }

    function endRun(win) {
      game.running = false;
      game.won = win;
      game.lost = !win;
      setStatus(win ? 'Level Cleared' : 'Crashed');
      menuOverlay.classList.remove('hidden');
      document.querySelector('.subtext').textContent = win
        ? 'Nice run! Pick another level or replay.'
        : 'You hit a spike. Try again!';
      startButton.textContent = win ? 'Replay' : 'Play';
    }

    function update(dt) {
      if (!game.running || game.paused) return;

      const level = levels[game.levelIndex];

      player.x += level.speed * dt;
      player.vy += BASE_GRAVITY * dt;
      player.y += player.vy * dt;

      const groundY = level.groundY;
      if (player.y + player.h >= groundY) {
        player.y = groundY - player.h;
        player.vy = 0;
        player.onGround = true;
      } else {
        player.onGround = false;
      }

      game.cameraX = Math.max(0, player.x - 180);

      for (const spike of level.obstacles) {
        const rectA = { x: player.x, y: player.y, w: player.w, h: player.h };
        const rectB = { x: spike.x, y: spike.y, w: spike.w, h: spike.h };
        if (intersects(rectA, rectB)) {
          endRun(false);
          return;
        }
      }

      if (player.x >= level.endX) {
        endRun(true);
      }
    }

    function intersects(a, b) {
      return (
        a.x < b.x + b.w &&
        a.x + a.w > b.x &&
        a.y < b.y + b.h &&
        a.y + a.h > b.y
      );
    }

    function drawBackground() {
      const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
      sky.addColorStop(0, '#101a30');
      sky.addColorStop(0.5, '#150d27');
      sky.addColorStop(1, '#1d1237');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (const star of game.stars) {
        ctx.fillStyle = `rgba(255,255,255,${star.a})`;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = 'rgba(115,245,255,0.08)';
      for (let i = 0; i < 14; i++) {
        const x = (i * 120) - (game.cameraX * 0.4 % 120);
        ctx.fillRect(x, 320, 70, 160);
      }

      ctx.fillStyle = 'rgba(255,102,217,0.06)';
      for (let i = 0; i < 10; i++) {
        const x = (i * 150) - (game.cameraX * 0.25 % 150);
        ctx.fillRect(x + 20, 250, 80, 200);
      }
    }

    function drawGround(level) {
      const y = level.groundY;
      ctx.fillStyle = '#121827';
      ctx.fillRect(0, y, canvas.width, canvas.height - y);

      for (let x = -((game.cameraX * 0.9) % 44); x < canvas.width + 50; x += 44) {
        ctx.fillStyle = 'rgba(115,245,255,0.12)';
        ctx.fillRect(x, y, 18, 18);
      }

      ctx.strokeStyle = 'rgba(115,245,255,0.6)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, y + 2);
      ctx.lineTo(canvas.width, y + 2);
      ctx.stroke();

      ctx.fillStyle = '#73f5ff';
      ctx.fillRect(level.endX - game.cameraX, y - 100, 10, 100);
      ctx.fillStyle = '#6ef7a6';
      ctx.fillRect(level.endX - game.cameraX, y - 100, 90, 10);
    }

    function drawSpikes(level) {
      ctx.fillStyle = '#ff5d73';
      for (const spike of level.obstacles) {
        const drawX = spike.x - game.cameraX;
        const drawY = spike.y;
        const w = spike.w;
        const h = spike.h;

        ctx.beginPath();
        ctx.moveTo(drawX, drawY + h);
        for (let i = 0; i <= 4; i++) {
          const px = drawX + (w / 4) * i;
          const py = i % 2 === 0 ? drawY + h : drawY + h - 12;
          ctx.lineTo(px, py);
        }
        ctx.lineTo(drawX + w, drawY + h);
        ctx.closePath();
        ctx.fill();
      }
    }

    function drawPlayer() {
      const drawX = player.x - game.cameraX;
      const drawY = player.y;

      ctx.save();
      ctx.translate(drawX + player.w / 2, drawY + player.h / 2);
      ctx.shadowColor = 'rgba(115,245,255,0.9)';
      ctx.shadowBlur = 18;
      ctx.fillStyle = '#73f5ff';
      ctx.fillRect(-player.w / 2, -player.h / 2, player.w, player.h);

      ctx.fillStyle = 'rgba(13,20,35,0.9)';
      ctx.fillRect(-player.w / 2 + 8, -player.h / 2 + 9, 8, 8);
      ctx.fillRect(player.w / 2 - 16, -player.h / 2 + 9, 8, 8);
      ctx.restore();
    }

    function draw() {
      drawBackground();
      const level = levels[game.levelIndex];
      drawGround(level);
      drawSpikes(level);
      drawPlayer();

      if (!game.running && !game.won && !game.lost) {
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
    }

    function gameLoop(timestamp) {
      const dt = Math.min((timestamp - game.lastTime) / 1000 || 0.016, 0.032);
      game.lastTime = timestamp;
      update(dt);
      draw();
      requestAnimationFrame(gameLoop);
    }

    document.addEventListener('keydown', (event) => {
      const key = event.key.toLowerCase();

      if ([' ', 'arrowup', 'w'].includes(key)) {
        event.preventDefault();
        if (!game.running && !menuOverlay.classList.contains('hidden')) {
          startLevel();
        } else {
          jump();
        }
      }

      if (key === 'p') {
        togglePause();
      }

      if (key === 'r') {
        startLevel();
      }
    });

    canvas.addEventListener('pointerdown', () => {
      if (menuOverlay.classList.contains('hidden')) {
        jump();
      }
    });

    jumpButton.addEventListener('pointerdown', (event) => {
      event.preventDefault();
      if (menuOverlay.classList.contains('hidden')) {
        jump();
      } else {
        startLevel();
      }
    });

    pauseButton.addEventListener('pointerdown', (event) => {
      event.preventDefault();
      togglePause();
    });

    document.querySelectorAll('.level-btn').forEach((button) => {
      button.addEventListener('click', () => {
        const index = Number(button.dataset.level);
        setCurrentLevel(index);
      });
    });

    startButton.addEventListener('click', () => {
      if (game.running) return;
      startLevel();
    });

    function init() {
      initStars();
      setCurrentLevel(0);
      requestAnimationFrame(gameLoop);
    }

    init();
  </script>
</body>
</html>
